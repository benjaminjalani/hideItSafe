<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decrypt File - hideItSafe</title>
    <style>
        :root[data-theme="light"] {
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --accent-bg: #f1f5f9;
        }

        :root[data-theme="dark"] {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent-bg: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
            transition: background-color 0.2s, border-color 0.2s, color 0.2s;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        header h1 {
            font-size: 24px;
            font-weight: 800;
            color: var(--text);
        }

        .theme-toggle {
            background: var(--accent-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .box {
            width: 100%;
            max-width: 600px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            margin-bottom: 40px;
        }

        .nav-link {
            display: inline-block;
            text-decoration: none;
            color: var(--primary);
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .box-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .file-wrapper {
            position: relative;
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 24px;
            text-align: center;
            background: var(--bg);
            cursor: pointer;
        }

        .file-wrapper input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .action-btn {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
        }

        .action-btn:hover {
            background: var(--primary-hover);
        }

        .result-box {
            margin-top: 20px;
            padding: 16px;
            background: var(--accent-bg);
            border-radius: 8px;
            font-size: 14px;
            border: 1px solid var(--border);
        }

        .download-btn {
            display: block;
            text-align: center;
            width: 100%;
            padding: 10px;
            background: var(--text);
            color: var(--card);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            margin-top: 12px;
        }

        .hidden {
            display: none !important;
        }

        footer {
            width: 100%;
            max-width: 600px;
            margin-top: auto;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
        }

        footer p {
            margin-bottom: 8px;
        }

        footer a {
            color: var(--primary);
            text-decoration: none;
            margin: 0 8px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <h1>hideItSafe</h1>
        <button id="mode-btn" class="theme-toggle" onclick="toggleTheme()">Switch to Dark Mode</button>
    </header>

    <div class="box">
        <a href="index.html" class="nav-link">← Back to Dashboard</a>
        <div class="box-title">Decrypt and Restore Data</div>

        <div style="margin-bottom: 16px;">
            <label>Upload Secure .bin File</label>
            <div class="file-wrapper">
                <span id="file-label" style="font-size:13px; color:var(--text-muted);">Select a compiled .bin file</span>
                <input type="file" id="target-bin" accept=".bin" onchange="document.getElementById('file-label').textContent=this.files[0].name">
            </div>
        </div>

        <button class="action-btn" onclick="processDecryption()">Decrypt File Data</button>

        <div id="result-block" class="hidden">
            <div class="result-box">
                <div id="preview-msg" style="font-weight: 500; word-break: break-all;"></div>
            </div>
            <a id="dl-btn" class="download-btn" href="#">Download Recovered Data</a>
        </div>
    </div>

    <footer>
        <p>© 2026 hideItSafe. All rights reserved.</p>
        <div class="links">
            <a href="https://github.com/benjaminjalani" target="_blank">GitHub</a>
            <a href="https://www.benjaminjalani.in" target="_blank">Visit Devoloper</a>
        </div>
    </footer>

    <script>
        function updateToggleButton(theme) {
            const btn = document.getElementById('mode-btn');
            if (theme === 'dark') {
                btn.textContent = 'to Light Mode';
            } else {
                btn.textContent = 'Dark Mode';
            }
        }

        function toggleTheme() {
            const root = document.documentElement;
            const newTheme = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateToggleButton(newTheme);
        }

        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateToggleButton(savedTheme);

        function runBinaryShift(str, shift) {
            return str.split('').map(char => {
                let code = char.charCodeAt(0);
                return String.fromCharCode((code + shift) % 65536);
            }).join('');
        }

        function processDecryption() {
            const file = document.getElementById('target-bin').files[0];
            if (!file) {
                alert("Please choose a file to decrypt!");
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const fullStr = e.target.result;
                const prefix = fullStr.substring(0, 4);
                const coreData = fullStr.substring(4);

                const decrypted = runBinaryShift(coreData, -3);
                const preview = document.getElementById('preview-msg');
                const dlBtn = document.getElementById('dl-btn');

                if (prefix === "TXT:") {
                    preview.textContent = `Text Revealed: "${decrypted}"`;
                    const blob = new Blob([decrypted], {type: 'text/plain'});
                    dlBtn.href = URL.createObjectURL(blob);
                    dlBtn.download = "restored-text.txt";
                    dlBtn.textContent = "Download Text File";
                } else if (prefix === "IMG:") {
                    preview.textContent = "Image binary map verified and reconstructed.";
                    const parts = decrypted.split(',');
                    const mime = parts[0].match(/:(.*?);/)[1];
                    const binaryStr = atob(parts[1]);
                    const bytes = new Uint8Array(binaryStr.length);
                    for (let i = 0; i < binaryStr.length; i++) {
                        bytes[i] = binaryStr.charCodeAt(i);
                    }

                    const blob = new Blob([bytes], {type: mime});
                    dlBtn.href = URL.createObjectURL(blob);
                    dlBtn.download = `restored-image.${mime.split('/')[1]}`;
                    dlBtn.textContent = "Download Image File";
                } else {
                    alert("This file structure was corrupted.");
                    return;
                }
                document.getElementById('result-block').classList.remove('hidden');
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
