<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encrypt Text - hideItSafe</title>
    <style>
        :root[data-theme="light"] {
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --accent-bg: #f1f5f9;
        }

        :root[data-theme="dark"] {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent-bg: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
            transition: background-color 0.2s, border-color 0.2s, color 0.2s;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        header h1 {
            font-size: 24px;
            font-weight: 800;
            color: var(--text);
        }

        .theme-toggle {
            background: var(--accent-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .box {
            width: 100%;
            max-width: 600px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            margin-bottom: 40px;
        }

        .nav-link {
            display: inline-block;
            text-decoration: none;
            color: var(--primary);
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .box-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            resize: none;
            outline: none;
            background: var(--bg);
            color: var(--text);
        }

        .action-btn {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
        }

        .action-btn:hover {
            background: var(--primary-hover);
        }

        .result-area {
            margin-top: 16px;
            padding: 12px;
            background: var(--accent-bg);
            border-radius: 8px;
            font-size: 13px;
            border: 1px solid var(--border);
        }

        .download-btn {
            display: block;
            text-align: center;
            width: 100%;
            padding: 10px;
            background: var(--text);
            color: var(--card);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            margin-top: 12px;
        }

        .hidden {
            display: none !important;
        }

        footer {
            width: 100%;
            max-width: 600px;
            margin-top: auto;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
        }

        footer p {
            margin-bottom: 8px;
        }

        footer a {
            color: var(--primary);
            text-decoration: none;
            margin: 0 8px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <h1>hideItSafe</h1>
        <button id="mode-btn" class="theme-toggle" onclick="toggleTheme()">Switch to Dark Mode</button>
    </header>

    <div class="box">
        <a href="index.html" class="nav-link">← Back to Dashboard</a>
        <div class="box-title">Encrypt Secret Text</div>

        <div style="margin-bottom: 16px;">
            <label>Type Secret Text</label>
            <textarea id="enc-text" placeholder="Type your text message here..."></textarea>
        </div>

        <button class="action-btn" onclick="processTextEncryption()">Create Secure File</button>

        <div id="result-block" class="hidden">
            <div class="result-area">Success! Text encrypted cleanly.</div>
            <a id="dl-btn" class="download-btn" download="text-payload.bin">Download Secure .bin File</a>
        </div>
    </div>

    <footer>
        <p>© 2026 hideItSafe. All rights reserved.</p>
        <div class="links">
            <a href="https://github.com/benjaminjalani" target="_blank">GitHub</a>
            <a href="https://www.benjaminjalani.in" target="_blank">Visit Devoloper</a>
        </div>
    </footer>

    <script>
        function updateToggleButton(theme) {
            const btn = document.getElementById('mode-btn');
            if (theme === 'dark') {
                btn.textContent = 'Light Mode';
            } else {
                btn.textContent = 'Dark Mode';
            }
        }

        function toggleTheme() {
            const root = document.documentElement;
            const newTheme = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateToggleButton(newTheme);
        }

        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateToggleButton(savedTheme);

        function runBinaryShift(str, shift) {
            return str.split('').map(char => {
                let code = char.charCodeAt(0);
                return String.fromCharCode((code + shift) % 65536);
            }).join('');
        }

        function processTextEncryption() {
            const textVal = document.getElementById('enc-text').value;
            if (!textVal.trim()) {
                alert("Please write something to encrypt!");
                return;
            }

            const finalData = "TXT:" + runBinaryShift(textVal, 3);
            const blob = new Blob([finalData], {type: 'application/octet-stream'});

            const dlBtn = document.getElementById('dl-btn');
            dlBtn.href = URL.createObjectURL(blob);
            document.getElementById('result-block').classList.remove('hidden');
        }
    </script>
</body>
</html>
